<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Error page: stays out of search results after launch too. -->
<meta name="robots" content="noindex, follow">
<title>Seite nicht gefunden · Page not found · Pickleball Südbaden e.V.</title>
<meta name="theme-color" content="#021427">
<!-- GitHub Pages serves this file for every missing path, at any depth, so it
     loads nothing: styles and the ball are inline, and the fonts are the system's. -->
<style>
  :root { --navy-950:#021427; --navy-800:#0C3561; --navy-200:#B5C5D8; --navy-100:#DCE4EE; --yellow-500:#FEDD02; --white:#FFFFFF; }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--navy-950); color: var(--white); font: 17px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 40px 16px; }
  main { max-width: 40em; width: 100%; }
  svg { display: block; width: 72px; height: 72px; margin-bottom: 24px; color: var(--white); }
  .score { display: inline-block; background: var(--navy-800); color: var(--yellow-500); font-weight: 800; letter-spacing: .06em; padding: 4px 10px 3px; border-radius: 4px; margin: 0 0 16px; font-size: 15px; }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 6vw, 52px); line-height: 1; font-weight: 900; font-style: italic; text-transform: uppercase; color: var(--yellow-500); }
  p { margin: 0 0 12px; color: var(--navy-100); }
  section + section { margin-top: 36px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.18); }
  a { color: var(--white); font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; display: inline-flex; align-items: center; min-height: 44px; }
  a:hover { color: var(--yellow-500); }
  :focus-visible { outline: 3px solid var(--yellow-500); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <circle cx="50" cy="50" r="45" fill="#FEDD02" stroke="currentColor" stroke-width="5"/>
    <g fill="#052443">
      <ellipse cx="50.7" cy="17.7" rx="4" ry="6.6" transform="rotate(-89 50.7 17.7)"/>
      <ellipse cx="27.3" cy="23.2" rx="3.3" ry="6.6" transform="rotate(-130 27.3 23.2)"/>
      <ellipse cx="65.9" cy="34.7" rx="5.5" ry="6.6" transform="rotate(-44 65.9 34.7)"/>
      <ellipse cx="33.8" cy="40.7" rx="5.9" ry="6.6" transform="rotate(-150 33.8 40.7)"/>
      <ellipse cx="83.9" cy="47.6" rx="3.6" ry="6.6" transform="rotate(-4 83.9 47.6)"/>
      <circle cx="53.6" cy="57" r="6.6"/>
      <ellipse cx="20.1" cy="59.6" rx="4.2" ry="6.6" transform="rotate(162 20.1 59.6)"/>
      <ellipse cx="72.4" cy="69.8" rx="4.4" ry="6.6" transform="rotate(42 72.4 69.8)"/>
      <ellipse cx="39.2" cy="75.8" rx="4.8" ry="6.6" transform="rotate(113 39.2 75.8)"/>
      <ellipse cx="53.9" cy="87.7" rx="2.3" ry="6.6" transform="rotate(84 53.9 87.7)"/>
    </g>
  </svg>
  <section lang="de" aria-labelledby="t-de">
    <p class="score">404 · Aus</p>
    <h1 id="t-de">Der Ball ist im Aus.</h1>
    <p>Diese Seite gibt es nicht, oder sie ist umgezogen.</p>
    <p><a class="home" href="/" data-path="">Zur Startseite</a></p>
  </section>
  <section lang="en" aria-labelledby="t-en">
    <p class="score">404 · Out</p>
    <h1 id="t-en">That ball is out.</h1>
    <p>This page doesn’t exist, or it has moved.</p>
    <p><a class="home" href="/en/" data-path="en/">Go to the home page</a></p>
  </section>
</main>
<script>
  // On the project URL (pickleball-suedbaden.github.io/www/) the site lives one folder down.
  (function () {
    if (!/\.github\.io$/.test(location.hostname)) return;
    var first = location.pathname.split('/')[1];
    if (!first) return;
    var links = document.querySelectorAll('a.home');
    for (var i = 0; i < links.length; i++) links[i].href = '/' + first + '/' + links[i].getAttribute('data-path');
  })();
</script>
</body>
</html>
